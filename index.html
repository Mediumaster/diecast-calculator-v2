<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diecast Custom Price Calculator Pro V2.5</title><style>body{font-family:Segoe UI,sans-serif;background:#0f172a;color:#e2e8f0;margin:0;padding:20px}.wrap{max-width:1000px;margin:auto}.card{background:#1e293b;padding:20px;border-radius:16px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}input,select,textarea{width:100%;padding:10px;border-radius:8px;border:none;margin-top:5px}button{background:#2563eb;color:white;border:none;padding:12px 18px;border-radius:10px;cursor:pointer;margin:5px}.results{font-size:18px;line-height:1.8}.price{font-size:32px;font-weight:bold;color:#4ade80}.table{width:100%;border-collapse:collapse}.table td{padding:6px;border-bottom:1px solid #334155}</style></head><body><div class="wrap"><div class="card"><h1>Diecast Custom Price Calculator Pro V2.5</h1><p>Clean pricing, project saving, and printable quotes.</p></div><div class="card grid"><div><label>Project Name</label><input id="project" placeholder="Custom Skyline"></div><div><label>Customer Name</label><input id="customer" placeholder="Customer"></div><div><label>Preset</label><select id="preset" onchange="presetFill()"><option>Custom</option><option>Wheel Swap</option><option>Basic Repaint</option><option>Premium Build</option></select></div></div><div class="card"><h2>Materials</h2><div class="grid"><div><label>Base Car</label><input type="number" id="base" value="5"></div><div><label>Parts</label><input type="number" id="parts" value="0"></div><div><label>Paint</label><input type="number" id="paint" value="0"></div><div><label>3D Printed Parts</label><input type="number" id="printed" value="0"></div><div><label>Decals</label><input type="number" id="decals" value="0"></div><div><label>Packaging</label><input type="number" id="packaging" value="0"></div></div></div><div class="card"><h2>Labor & Fees</h2><div class="grid"><div><label>Hours Worked</label><input type="number" id="hours" value="2"></div><div><label>Hourly Rate</label><input type="number" id="rate" value="25"></div><div><label>Profit Margin %</label><input type="number" id="profitMargin" value="30"></div><div><label>Marketplace Fee %</label><input type="number" id="fee" value="10"></div><div><label>Shipping Cost</label><input type="number" id="ship" value="0"></div></div><button onclick="calc()">Calculate</button><button onclick="saveProject()">Save Project</button><button onclick="loadProject()">Load Project</button><button onclick="window.print()">Print Quote</button></div><div class="card"><h2>Results</h2><div class="results"><div class="price">$<span id="sale">0.00</span></div><table class="table"><tr><td>Materials</td><td id="materials">0</td></tr><tr><td>Labor</td><td id="labor">0</td></tr><tr><td>Total Cost</td><td id="cost">0</td></tr><tr><td>Estimated Profit</td><td id="profit">0</td></tr><tr><td>Effective Hourly Earnings</td><td id="hourly">0</td></tr></table><h3>Pricing Targets</h3><div id="targets"></div></div></div><div class="card"><h2>Project Notes</h2><textarea id="notes" rows="4"></textarea></div></div><script>function presetFill(){let p=preset.value;if(p==='Wheel Swap'){base.value=5;parts.value=4;paint.value=0;hours.value=1;}if(p==='Basic Repaint'){base.value=5;parts.value=0;paint.value=5;hours.value=3;}if(p==='Premium Build'){base.value=8;parts.value=15;paint.value=10;printed.value=10;hours.value=8;}}function calc(){let m=['base','parts','paint','printed','decals','packaging'].reduce((a,id)=>a+(parseFloat(document.getElementById(id).value)||0),0);let labor=(+hours.value||0)*(+rate.value||0);let total=m+labor+(+ship.value||0);let sale=total/(1-(((+profitMargin.value||0)+(+fee.value||0))/100));let prof=sale-total;saleSpan=document.getElementById('sale');saleSpan.innerText=sale.toFixed(2);materials.innerText='$'+m.toFixed(2);document.getElementById('labor').innerText='$'+labor.toFixed(2);cost.innerText='$'+total.toFixed(2);document.getElementById('profit').innerText='$'+prof.toFixed(2);hourly.innerText='$'+((hours.value>0)?prof/hours.value:0).toFixed(2)+'/hr';let t='';[20,30,40,50].forEach(x=>t+='<div>'+x+'% Profit Target: $'+(total/(1-((x+(+fee.value||0))/100))).toFixed(2)+'</div>');targets.innerHTML=t;}function saveProject(){const data={};document.querySelectorAll('input,textarea,select').forEach(e=>data[e.id]=e.value);localStorage.setItem('diecastV25',JSON.stringify(data));alert('Project Saved');}function loadProject(){let d=JSON.parse(localStorage.getItem('diecastV25')||'{}');Object.keys(d).forEach(k=>{let e=document.getElementById(k);if(e)e.value=d[k];});calc();alert('Project Loaded');}calc();</script></body></html>
